<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title></title>
  <link rel="stylesheet" href="fonts/inter/wght.css">
  <link rel="stylesheet" href="fonts/source-serif-4/wght.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="titlebar"><span id="app-name"></span></header>
  <main>
    <h1 class="greeting">
      <img class="logo" src="icon.svg" alt="">
      <span id="greeting-text"></span>
      <span id="name-wrap" class="name-wrap"></span>
    </h1>
    <section id="cards" class="cards"></section>
    <button id="add-account" class="add" type="button"></button>
    <p id="signin-note" class="note" hidden></p>
  </main>

  <p id="version" class="version"></p>

  <div id="menu" class="menu" role="menu" hidden></div>

  <dialog id="signin">
    <h2 id="signin-title"></h2>
    <p id="signin-body"></p>
    <ol id="signin-steps" class="steps" hidden></ol>
    <div class="dialog-buttons">
      <button id="signin-cancel" type="button"></button>
      <button id="signin-confirm" class="primary" type="button"></button>
    </div>
  </dialog>

  <dialog id="details">
    <form method="dialog">
      <h2 id="details-title"></h2>
      <p id="details-body"></p>
      <label id="details-name-row" class="field"><span id="details-name-label"></span>
        <input id="details-name" type="text" maxlength="40" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span id="details-email-label"></span>
        <input id="details-email" type="text" maxlength="254" autocomplete="off" spellcheck="false" inputmode="email"></label>
      <label class="field"><span id="details-real-name-label"></span>
        <input id="details-real-name" type="text" maxlength="60" autocomplete="off" spellcheck="false"></label>
      <p id="details-error" class="error" role="alert"></p>
      <div class="dialog-buttons">
        <button id="details-cancel" type="button"></button>
        <button id="details-confirm" class="primary" type="submit" value="confirm"></button>
      </div>
    </form>
  </dialog>

  <dialog id="memories">
    <h2 id="memories-title"></h2>
    <p id="memories-body"></p>
    <ol id="memories-steps" class="how"></ol>
    <textarea id="memories-text" rows="7" spellcheck="false" autocomplete="off"></textarea>
    <button id="memories-file" class="link" type="button"></button>
    <input id="memories-file-input" type="file" accept=".zip,.txt,.md" hidden>
    <p id="memories-tip" class="tip"></p>
    <p id="memories-error" class="error" role="alert"></p>
    <div class="dialog-buttons">
      <button id="memories-cancel" type="button"></button>
      <button id="memories-copy" type="button"></button>
      <button id="memories-next" class="primary" type="button"></button>
    </div>
  </dialog>

  <input id="photo-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <input id="dialog-input" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      <div class="dialog-buttons">
        <button id="dialog-cancel" type="button"></button>
        <button id="dialog-confirm" type="submit" value="confirm"></button>
      </div>
    </form>
  </dialog>
</body>
</html>

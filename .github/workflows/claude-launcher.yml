name: claude-launcher

on:
  push:
    branches: [main]
    paths:
      - 'claude-launcher/**'
      - '.github/workflows/claude-launcher.yml'
  pull_request:
    paths:
      - 'claude-launcher/**'
      - '.github/workflows/claude-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: claude-launcher

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-launcher/package-lock.json
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-launcher/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-installer
          path: claude-launcher/dist/*.exe
          if-no-files-found: error

      # On a push to main (a merged PR): release launcher-v<package.json version>, once per version.
      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="launcher-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          # Notes = the "## [version]" section of the CHANGELOG, without its heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/*.exe --target "$GITHUB_SHA" \
            --title "Multi-Account Launcher for Claude $version" \
            --notes-file release-notes.md $prerelease

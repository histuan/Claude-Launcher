name: claude-launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # npm test already compiled the app into out/, which electron-builder packages.
      - run: npx electron-builder --win --publish never
      # README "Download vX" badge; the release uploads it, so releases/latest/download/badge-download.svg is live.
      - name: Make version badge
        run: node scripts/make-badges.ts --release
      # The self-update files the release uploads (checked on every run, so a PR shows it before the merge).
      - name: Check update files
        shell: bash
        run: |
          ls -l dist/*.exe dist/*.exe.blockmap dist/latest.yml
          grep -q "Claude-Launcher-Setup-$(node -p "require('./package.json').version").exe" dist/latest.yml
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-installer
          path: dist/*.exe
          if-no-files-found: error

      # On a push to main (a merged PR): release v<package.json version>, once per version.
      # Since 0.5.0 the tag and the title are "v<version>"; the old launcher-v* tags stay as they are.
      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          # Notes = the "## [version]" section of the CHANGELOG, without its heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # A fixed-name copy of the installer, so releases/latest/download/Claude-Launcher-Setup.exe (the README
          # button) always downloads the latest one. The self-update keeps using the versioned file in latest.yml.
          cp "dist/Claude-Launcher-Setup-$version.exe" dist/Claude-Launcher-Setup.exe
          # The download link goes first in the notes, so nobody has to pick among the files at the bottom.
          url="https://github.com/histuan/Claude-Launcher/releases/download/$tag/Claude-Launcher-Setup-$version.exe"
          { printf '## Download\n\n**[⬇ Download Claude-Launcher-Setup-%s.exe](%s)** (Windows 10 / 11)\n\n' "$version" "$url"
            printf 'Already installed? The launcher updates itself and asks you first. The other files below are used\n'
            printf 'by that automatic update; you do not need them.\n\n## What changed\n'
            cat release-notes.md; } > release-notes-full.md
          mv release-notes-full.md release-notes.md
          # Since 0.6.0 the self-update (electron-updater, GitHub provider) reads latest.yml from the latest release
          # and the .blockmap for a smaller download, so both go next to the .exe.
          for f in dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/badge-download.svg; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          # Since 0.3.0 (the first usable version) every release is a regular one, marked as latest.
          gh release create "$tag" dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/badge-download.svg --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md --latest

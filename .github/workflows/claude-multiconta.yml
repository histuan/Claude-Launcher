name: claude-multiconta

on:
  push:
    branches: ['**']
    tags: ['multiconta-v*']
    paths:
      - 'claude-multiconta/**'
      - '.github/workflows/claude-multiconta.yml'
  pull_request:
    paths:
      - 'claude-multiconta/**'
      - '.github/workflows/claude-multiconta.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: claude-multiconta

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-multiconta/package-lock.json
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-multiconta/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: multiconta-instalador
          path: claude-multiconta/dist/*.exe
          if-no-files-found: error
      - name: Criar Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/multiconta-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes
